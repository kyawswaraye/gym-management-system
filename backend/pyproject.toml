[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/*/models.py" = ["DJ001", "RUF012"]
"apps/*/views.py" = ["RUF012"]
"apps/*/scan_views.py" = ["RUF012"]
"apps/*/device_views.py" = ["RUF012"]
"apps/*/member_views.py" = ["RUF012"]
"apps/*/staff_views.py" = ["RUF012"]
"apps/*/role_views.py" = ["RUF012"]
"apps/common/api/views.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
explicit_package_bases = true
exclude = "migrations/"

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["apps.*.models"]
disable_error_code = ["misc", "var-annotated"]

[[tool.mypy.overrides]]
module = [
  "apps.common.api.exceptions",
  "apps.files.exceptions",
  "apps.members.exceptions",
  "apps.tenants.exceptions",
]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = [
  "apps.common.api.schema",
  "apps.audit.serializers",
  "apps.tenants.serializers",
  "apps.tenants.staff_serializers",
  "apps.tenants.role_serializers",
  "apps.users.schema",
  "apps.users.serializers",
  "apps.files.serializers",
]
disable_error_code = ["assignment", "no-untyped-call", "type-arg"]

[[tool.mypy.overrides]]
module = ["apps.members.serializers", "apps.members.device_serializers"]
disable_error_code = ["assignment", "type-arg"]

[[tool.mypy.overrides]]
module = [
  "apps.common.api.middleware",
  "apps.members.views",
  "apps.members.scan_views",
  "apps.members.device_views",
  "apps.tenants.staff_views",
  "apps.tenants.role_views",
  "apps.tenants.views",
  "apps.users.authentication",
  "apps.users.views",
  "apps.files.views",
  "apps.files.authentication",
]
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "misc",
  "no-untyped-call",
  "no-untyped-def",
  "union-attr",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
  "postgresql: requires a real PostgreSQL database and runtime/migration roles",
]
addopts = "--strict-markers"
