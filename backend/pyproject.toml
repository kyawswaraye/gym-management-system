[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/*/models.py" = ["DJ001", "RUF012"]
"apps/*/views.py" = ["RUF012"]
"apps/*/booking_views.py" = ["RUF012"]
"apps/*/pt_booking_views.py" = ["RUF012"]
"apps/*/pt_sale_views.py" = ["RUF012"]
"apps/*/pt_commission_views.py" = ["RUF012"]
"apps/*/package_views.py" = ["RUF012"]
"apps/*/payment_views.py" = ["RUF012"]
"apps/reports/views.py" = ["RUF012"]
"apps/*/scan_views.py" = ["RUF012"]
"apps/*/self_views.py" = ["RUF012"]
"apps/*/device_views.py" = ["RUF012"]
"apps/*/member_device_views.py" = ["RUF012"]
"apps/*/member_views.py" = ["RUF012"]
"apps/*/staff_views.py" = ["RUF012"]
"apps/*/role_views.py" = ["RUF012"]
"apps/common/api/views.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
explicit_package_bases = true
exclude = "migrations/"

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["apps.*.models"]
disable_error_code = ["misc", "var-annotated"]

[[tool.mypy.overrides]]
module = [
  "apps.common.api.exceptions",
  "apps.common.finance.exceptions",
  "apps.files.exceptions",
  "apps.members.exceptions",
  "apps.trainers.exceptions",
  "apps.cashbook.exceptions",
  "apps.classes.exceptions",
  "apps.announcements.exceptions",
  "apps.expenses.exceptions",
  "apps.salaries.exceptions",
  "apps.tenants.exceptions",
]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = [
  "apps.common.api.schema",
  "apps.audit.serializers",
  "apps.tenants.serializers",
  "apps.tenants.staff_serializers",
  "apps.tenants.role_serializers",
  "apps.users.schema",
  "apps.users.serializers",
  "apps.files.serializers",
]
disable_error_code = ["assignment", "no-untyped-call", "type-arg"]

[[tool.mypy.overrides]]
module = [
  "apps.members.serializers",
  "apps.members.device_serializers",
  "apps.members.payment_serializers",
  "apps.cashbook.serializers",
  "apps.expenses.serializers",
  "apps.salaries.serializers",
  "apps.inventory.serializers",
  "apps.sales.serializers",
  "apps.trainers.serializers",
  "apps.classes.serializers",
  "apps.reports.serializers",
  "apps.members.self_serializers",
  "apps.members.member_device_serializers",
  "apps.announcements.serializers",
  "apps.notifications.member_serializers",
]
disable_error_code = ["assignment", "type-arg"]

[[tool.mypy.overrides]]
module = [
  "apps.common.api.middleware",
  "apps.members.views",
  "apps.members.scan_views",
  "apps.members.self_views",
  "apps.members.device_views",
  "apps.members.member_device_views",
  "apps.announcements.views",
  "apps.notifications.member_views",
  "apps.tenants.staff_views",
  "apps.tenants.role_views",
  "apps.tenants.views",
  "apps.users.authentication",
  "apps.users.views",
  "apps.files.views",
  "apps.files.member_views",
  "apps.cashbook.views",
  "apps.expenses.views",
  "apps.salaries.views",
  "apps.inventory.views",
  "apps.sales.views",
  "apps.trainers.views",
  "apps.trainers.pt_sale_views",
  "apps.trainers.pt_commission_views",
  "apps.trainers.package_views",
  "apps.classes.views",
  "apps.classes.booking_views",
  "apps.trainers.pt_booking_views",
  "apps.members.payment_views",
  "apps.reports.views",
  "apps.reports.export_views",
  "apps.files.authentication",
]
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "misc",
  "no-untyped-call",
  "no-untyped-def",
  "union-attr",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
  "postgresql: requires a real PostgreSQL database and runtime/migration roles",
]
addopts = "--strict-markers"
