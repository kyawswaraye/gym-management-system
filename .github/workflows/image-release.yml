# Phase 8 increment 2. Tag-controlled image release only.
# This file does not deploy, does not prove branch or tag protection,
# and does not mean images have been published.

name: Image release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full commit SHA of the semver tag being released
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements/development.txt
      - name: Require a semver tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_INPUT_SHA: ${{ inputs.git_sha }}
        run: python scripts/release_supply_chain.py check-ref
      - name: Validate production artifacts
        run: python scripts/production_artifacts.py --repo . --require-django --require-docker
      - name: Test artifact and release checks
        working-directory: backend
        run: python -m pytest tests/unit/test_production_artifacts.py tests/unit/test_release_supply_chain.py tests/unit/test_backup_policy.py tests/unit/test_restore_verification.py tests/unit/test_observability.py tests/unit/test_deployment_control.py tests/unit/test_staging_rehearsal.py tests/unit/test_load_characterization.py tests/unit/test_finance_characterization.py tests/unit/test_pt_characterization.py tests/unit/test_pt_cash_characterization.py tests/unit/test_endurance_characterization.py tests/unit/test_security_characterization.py tests/unit/test_identity_security_characterization.py tests/unit/test_isolation_characterization.py

  build-scan:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a semver tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_INPUT_SHA: ${{ inputs.git_sha }}
        run: python3 scripts/release_supply_chain.py check-ref
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=release/api,tar=false
      - name: Bind API layout to its digest
        env:
          DIGEST: ${{ steps.api.outputs.digest }}
        run: python3 scripts/release_supply_chain.py bind-digest --digest "$DIGEST" --layout release/api --output release/api-digest.txt
      - name: Build web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=release/web,tar=false
      - name: Bind web layout to its digest
        env:
          DIGEST: ${{ steps.web.outputs.digest }}
        run: python3 scripts/release_supply_chain.py bind-digest --digest "$DIGEST" --layout release/web --output release/web-digest.txt
      - name: Build PostgreSQL image
        id: postgres
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          file: infra/postgres/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=release/postgres,tar=false
      - name: Bind PostgreSQL layout to its digest
        env:
          DIGEST: ${{ steps.postgres.outputs.digest }}
        run: python3 scripts/release_supply_chain.py bind-digest --digest "$DIGEST" --layout release/postgres --output release/postgres-digest.txt
      - name: Upload scanned image layouts
        uses: actions/upload-artifact@v4
        with:
          name: release-layouts
          path: release
          retention-days: 7
          if-no-files-found: error
      - name: API SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.api.outputs.digest }}
          input: release/api
          format: cyclonedx
          output: release/api.cdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0
          cache: "false"
          timeout: 20m
      - name: API vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.api.outputs.digest }}
          input: release/api
          format: json
          output: release/api-scan.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0
          cache: "false"
          timeout: 20m
      - name: Web SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.web.outputs.digest }}
          input: release/web
          format: cyclonedx
          output: release/web.cdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0
          cache: "false"
          timeout: 20m
      - name: Web vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.web.outputs.digest }}
          input: release/web
          format: json
          output: release/web-scan.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0
          cache: "false"
          timeout: 20m
      - name: PostgreSQL SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.postgres.outputs.digest }}
          input: release/postgres
          format: cyclonedx
          output: release/postgres.cdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0
          cache: "false"
          timeout: 20m
      - name: PostgreSQL vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.postgres.outputs.digest }}
          input: release/postgres
          format: json
          output: release/postgres-scan.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0
          cache: "false"
          timeout: 20m
      - name: Upload SBOM and scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            release/*.cdx.json
            release/*-scan.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Publish attested images
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-scan
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a semver tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_INPUT_SHA: ${{ inputs.git_sha }}
        run: python3 scripts/release_supply_chain.py check-ref
      - uses: actions/download-artifact@v4
        with:
          name: release-layouts
          path: release
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Normalize registry owner
        id: owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(python3 scripts/release_supply_chain.py normalize-owner --owner "$REPOSITORY_OWNER")"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
      - name: Commit image tag
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/release_supply_chain.py immutable-tag --sha "$RELEASE_SHA"
      - name: Publish API image
        id: publish-api
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DIGEST_FILE: release/api-digest.txt
        run: |
          reference="$(python3 scripts/release_supply_chain.py publish-image --layout release/api --name gym-api)"
          REFERENCE="$reference" python3 -c 'import os; ref=os.environ["REFERENCE"]; repo,digest=ref.rsplit("@",1); handle=open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8"); handle.write(f"digest={digest}\nrepository={repo}\n"); handle.close()'
      - name: Publish web image
        id: publish-web
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DIGEST_FILE: release/web-digest.txt
        run: |
          reference="$(python3 scripts/release_supply_chain.py publish-image --layout release/web --name gym-web)"
          REFERENCE="$reference" python3 -c 'import os; ref=os.environ["REFERENCE"]; repo,digest=ref.rsplit("@",1); handle=open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8"); handle.write(f"digest={digest}\nrepository={repo}\n"); handle.close()'
      - name: Publish PostgreSQL image
        id: publish-postgres
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DIGEST_FILE: release/postgres-digest.txt
        run: |
          reference="$(python3 scripts/release_supply_chain.py publish-image --layout release/postgres --name gym-postgres)"
          REFERENCE="$reference" python3 -c 'import os; ref=os.environ["REFERENCE"]; repo,digest=ref.rsplit("@",1); handle=open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8"); handle.write(f"digest={digest}\nrepository={repo}\n"); handle.close()'
      - name: Attest API image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish-api.outputs.repository }}
          subject-digest: ${{ steps.publish-api.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest web image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish-web.outputs.repository }}
          subject-digest: ${{ steps.publish-web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest PostgreSQL image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.publish-postgres.outputs.repository }}
          subject-digest: ${{ steps.publish-postgres.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record build time
        id: clock
        run: python3 -c 'import datetime, os; value=datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"); open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write(f"value={value}\n")'
      - name: Write release manifest
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_WORKFLOW_FILE: image-release.yml
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TIMESTAMP: ${{ steps.clock.outputs.value }}
        run: python3 scripts/release_supply_chain.py write-manifest --output release-manifest.json --api-digest-file release/api-digest.txt --web-digest-file release/web-digest.txt --postgres-digest-file release/postgres-digest.txt
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 7
          if-no-files-found: error
