name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gym_platform
          POSTGRES_USER: gym_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_admin -d gym_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-django-secret-key-not-for-production-use-50chars
      ALLOWED_HOSTS: localhost
      DB_NAME: gym_platform
      DB_HOST: localhost
      DB_PORT: 5432
      DATABASE_ROLE_MODE: runtime
      RUNTIME_DB_USER: gym_runtime
      RUNTIME_DB_PASSWORD: ci-runtime-password
      MIGRATION_DB_USER: gym_migration
      MIGRATION_DB_PASSWORD: ci-migration-password
      TEST_DB_USER: gym_admin
      TEST_DB_PASSWORD: ci-admin-password
      RUN_POSTGRESQL_TESTS: "1"
      BFF_SHARED_SECRET: ci-bff-shared-secret-32-chars-min
      JWT_ISSUER: gym-platform-api
      JWT_STAFF_AUDIENCE: gym-platform
      JWT_MEMBER_AUDIENCE: gym-platform-member
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-not-for-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision database roles
        env:
          PGPASSWORD: ci-admin-password
        run: |
          psql -h localhost -U gym_admin -d gym_platform <<'SQL'
          CREATE ROLE gym_migration LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-migration-password';
          CREATE ROLE gym_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-runtime-password';
          CREATE ROLE gym_auth_bootstrap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          GRANT gym_auth_bootstrap TO gym_migration;
          ALTER DATABASE gym_platform OWNER TO gym_migration;
          ALTER SCHEMA public OWNER TO gym_migration;
          GRANT CONNECT ON DATABASE gym_platform TO gym_runtime;
          GRANT USAGE ON SCHEMA public TO gym_runtime, gym_migration;
          SQL
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -r backend/requirements/development.txt
      - name: Lint and type-check
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy apps config
          python manage.py makemigrations --check --dry-run
      - name: Audit Python dependencies
        run: pip-audit --strict -r backend/requirements/base.txt
      - name: Check API schema
        working-directory: backend
        run: |
          python manage.py spectacular \
            --file /tmp/openapi.v1.json \
            --format openapi-json \
            --validate \
            --fail-on-warn
          diff -u ../contracts/openapi.v1.json /tmp/openapi.v1.json
      - name: Test
        working-directory: backend
        run: pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DJANGO_API_URL: http://127.0.0.1:8000
      APP_ORIGINS: http://localhost:3000
      ACCESS_EXPIRED_CODE: ACCESS_TOKEN_EXPIRED
      ALLOW_INSECURE_LOCALHOST_COOKIES: "true"
      BFF_SHARED_SECRET: ci-bff-shared-secret-32-chars-min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Check generated API types
        run: |
          npm --prefix ../contracts/generator ci
          npm --prefix ../contracts/generator audit --audit-level=high
          npm --prefix ../contracts/generator run generate
          git diff --exit-code -- src/types/api.generated.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - run: make mobile-install
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm audit --audit-level=critical
      - name: Check generated API types
        run: |
          npm --prefix contracts/generator ci
          npm --prefix contracts/generator audit --audit-level=high
          npm --prefix contracts/generator run generate
          git diff --exit-code -- mobile/src/types/api.generated.ts
      - run: make mobile-check
      - run: make mobile-test
      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

  mobile-ios:
    name: Mobile iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
          working-directory: mobile
      - run: make mobile-install
      - run: make mobile-ios

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gym_platform
          POSTGRES_USER: gym_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_admin -d gym_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: gym_admin
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      MIGRATION_DB_USER: gym_migration
      MIGRATION_DB_PASSWORD: ci-migration-password
      RUNTIME_DB_USER: gym_runtime
      RUNTIME_DB_PASSWORD: ci-runtime-password
      E2E_RESET: "1"
      E2E_DJANGO_SECRET_KEY: e2e-django-secret-key-placeholder-not-for-production-use
      E2E_BFF_SHARED_SECRET: e2e-bff-shared-secret-placeholder-32
      E2E_MFA_ENCRYPTION_KEY: e2e-mfa-encryption-key-placeholder
      E2E_FINANCE_IDEMPOTENCY_ENCRYPTION_KEY: e2e-finance-idempotency-key-placeholder
      E2E_MFA_TOKEN_PEPPER: e2e-mfa-token-pepper-placeholder
      E2E_REFRESH_TOKEN_PEPPER: e2e-refresh-pepper-placeholder-value
      E2E_INVITATION_TOKEN_PEPPER: e2e-invitation-pepper-placeholder
      E2E_PASSWORD_RESET_TOKEN_PEPPER: e2e-password-reset-pepper-placeholder
      E2E_PLATFORM_PASSWORD: e2e-platform-password
      E2E_PLATFORM_TOTP_SECRET: E2EPLATFORMTOTPPLACEHOLDERAAAAAA
      E2E_OWNER_PASSWORD: e2e-owner-password
      E2E_OWNER_TOTP_SECRET: E2EOWNERTOTPPLACEHOLDERAAAAAAAAA
      DJANGO_API_URL: http://127.0.0.1:8010
      APP_ORIGINS: http://localhost:3010
      ACCESS_EXPIRED_CODE: ACCESS_TOKEN_EXPIRED
      ALLOW_INSECURE_LOCALHOST_COOKIES: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision database roles
        env:
          PGPASSWORD: ci-admin-password
        run: |
          psql -h localhost -U gym_admin -d gym_platform <<'SQL'
          CREATE ROLE gym_migration LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-migration-password';
          CREATE ROLE gym_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-runtime-password';
          CREATE ROLE gym_auth_bootstrap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          GRANT gym_auth_bootstrap TO gym_migration;
          ALTER DATABASE gym_platform OWNER TO gym_migration;
          ALTER SCHEMA public OWNER TO gym_migration;
          GRANT CONNECT ON DATABASE gym_platform TO gym_runtime;
          GRANT USAGE ON SCHEMA public TO gym_runtime, gym_migration;
          SQL
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -r backend/requirements/development.txt
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Browser smoke
        run: bash scripts/e2e.sh

  production-artifacts:
    name: Production artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements/development.txt
      - name: Validate production artifacts
        run: python scripts/production_artifacts.py --repo . --require-django --require-docker
      - name: Test production artifact validation
        working-directory: backend
        run: python -m pytest tests/unit/test_production_artifacts.py tests/unit/test_release_supply_chain.py tests/unit/test_backup_policy.py tests/unit/test_restore_verification.py tests/unit/test_observability.py tests/unit/test_deployment_control.py tests/unit/test_staging_rehearsal.py tests/unit/test_load_characterization.py tests/unit/test_finance_characterization.py tests/unit/test_pt_characterization.py tests/unit/test_pt_cash_characterization.py tests/unit/test_endurance_characterization.py tests/unit/test_security_characterization.py tests/unit/test_identity_security_characterization.py tests/unit/test_isolation_characterization.py
      - name: Build API image
        run: docker build -f backend/Dockerfile -t gym-api:ci backend
      - name: Build web image
        run: docker build -f web/Dockerfile -t gym-web:ci web
      - name: Build PostgreSQL image
        run: docker build -f infra/postgres/Dockerfile -t gym-postgres:ci infra/postgres
