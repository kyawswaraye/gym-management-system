name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gym_platform
          POSTGRES_USER: gym_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_admin -d gym_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-django-secret-key-not-for-production-use-50chars
      ALLOWED_HOSTS: localhost
      DB_NAME: gym_platform
      DB_HOST: localhost
      DB_PORT: 5432
      DATABASE_ROLE_MODE: runtime
      RUNTIME_DB_USER: gym_runtime
      RUNTIME_DB_PASSWORD: ci-runtime-password
      MIGRATION_DB_USER: gym_migration
      MIGRATION_DB_PASSWORD: ci-migration-password
      TEST_DB_USER: gym_admin
      TEST_DB_PASSWORD: ci-admin-password
      RUN_POSTGRESQL_TESTS: "1"
      BFF_SHARED_SECRET: ci-bff-shared-secret-32-chars-min
      JWT_ISSUER: gym-platform-api
      JWT_STAFF_AUDIENCE: gym-platform
      JWT_MEMBER_AUDIENCE: gym-platform-member
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision database roles
        env:
          PGPASSWORD: ci-admin-password
        run: |
          psql -h localhost -U gym_admin -d gym_platform <<'SQL'
          CREATE ROLE gym_migration LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-migration-password';
          CREATE ROLE gym_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-runtime-password';
          CREATE ROLE gym_auth_bootstrap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          GRANT gym_auth_bootstrap TO gym_migration;
          ALTER DATABASE gym_platform OWNER TO gym_migration;
          ALTER SCHEMA public OWNER TO gym_migration;
          GRANT CONNECT ON DATABASE gym_platform TO gym_runtime;
          GRANT USAGE ON SCHEMA public TO gym_runtime, gym_migration;
          SQL
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -r backend/requirements/development.txt
      - name: Lint and type-check
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy apps config
          python manage.py makemigrations --check --dry-run
      - name: Audit Python dependencies
        run: pip-audit --strict -r backend/requirements/base.txt
      - name: Check API schema
        working-directory: backend
        run: |
          python manage.py spectacular \
            --file /tmp/openapi.v1.json \
            --format openapi-json \
            --validate
          diff -u ../contracts/openapi.v1.json /tmp/openapi.v1.json
      - name: Test
        working-directory: backend
        run: pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DJANGO_API_URL: http://127.0.0.1:8000
      APP_ORIGINS: http://localhost:3000
      ACCESS_EXPIRED_CODE: ACCESS_TOKEN_EXPIRED
      ALLOW_INSECURE_LOCALHOST_COOKIES: "true"
      BFF_SHARED_SECRET: ci-bff-shared-secret-32-chars-min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Check generated API types
        run: |
          npm --prefix ../contracts/generator ci
          npm --prefix ../contracts/generator audit --audit-level=high
          npm --prefix ../contracts/generator run generate
          git diff --exit-code -- src/types/api.generated.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gym_platform
          POSTGRES_USER: gym_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_admin -d gym_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: gym_admin
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      MIGRATION_DB_USER: gym_migration
      MIGRATION_DB_PASSWORD: ci-migration-password
      RUNTIME_DB_USER: gym_runtime
      RUNTIME_DB_PASSWORD: ci-runtime-password
      E2E_RESET: "1"
      E2E_DJANGO_SECRET_KEY: e2e-django-secret-key-placeholder-not-for-production-use
      E2E_BFF_SHARED_SECRET: e2e-bff-shared-secret-placeholder-32
      E2E_MFA_ENCRYPTION_KEY: e2e-mfa-encryption-key-placeholder
      E2E_MFA_TOKEN_PEPPER: e2e-mfa-token-pepper-placeholder
      E2E_REFRESH_TOKEN_PEPPER: e2e-refresh-pepper-placeholder-value
      E2E_INVITATION_TOKEN_PEPPER: e2e-invitation-pepper-placeholder
      E2E_PLATFORM_PASSWORD: e2e-platform-password
      E2E_PLATFORM_TOTP_SECRET: E2EPLATFORMTOTPPLACEHOLDERAAAAAA
      E2E_OWNER_PASSWORD: e2e-owner-password
      E2E_OWNER_TOTP_SECRET: E2EOWNERTOTPPLACEHOLDERAAAAAAAAA
      DJANGO_API_URL: http://127.0.0.1:8010
      APP_ORIGINS: http://localhost:3010
      ACCESS_EXPIRED_CODE: ACCESS_TOKEN_EXPIRED
      ALLOW_INSECURE_LOCALHOST_COOKIES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision database roles
        env:
          PGPASSWORD: ci-admin-password
        run: |
          psql -h localhost -U gym_admin -d gym_platform <<'SQL'
          CREATE ROLE gym_migration LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-migration-password';
          CREATE ROLE gym_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-runtime-password';
          CREATE ROLE gym_auth_bootstrap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          GRANT gym_auth_bootstrap TO gym_migration;
          ALTER DATABASE gym_platform OWNER TO gym_migration;
          ALTER SCHEMA public OWNER TO gym_migration;
          GRANT CONNECT ON DATABASE gym_platform TO gym_runtime;
          GRANT USAGE ON SCHEMA public TO gym_runtime, gym_migration;
          SQL
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -r backend/requirements/development.txt
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Browser smoke
        run: bash scripts/e2e.sh
