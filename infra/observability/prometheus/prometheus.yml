# Private scrape configuration. No remote_write and no public listener.
# Fixture image digests are not a live Prometheus deployment.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: gym-production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: caddy
    static_configs:
      - targets:
          - caddy:2020
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
  - job_name: blackbox-web
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://web:3000/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-api
    metrics_path: /probe
    params:
      module:
        - http_api_health
    static_configs:
      - targets:
          - http://api:8000/api/v1/health/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-tls
    metrics_path: /probe
    params:
      module:
        - tls_connect
    static_configs:
      - targets:
          - caddy:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
