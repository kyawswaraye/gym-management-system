# Numeric columns only. Do not add labels, query text, or relation names.
gym_pg:
  query: >
    SELECT
      (SELECT count(*)::float8 FROM pg_stat_activity
        WHERE datname = current_database()) AS connections,
      CASE WHEN current_setting('archive_mode') = 'on'
        THEN 1::float8 ELSE 0::float8 END AS archive_mode_on,
      COALESCE(EXTRACT(EPOCH FROM (clock_timestamp() - last_archived_time)), -1)::float8
        AS wal_age_seconds,
      failed_count::float8 AS wal_failed_count
    FROM pg_stat_archiver
  metrics:
    - connections:
        usage: GAUGE
        description: Connections in the current database
    - archive_mode_on:
        usage: GAUGE
        description: 1 when archive_mode is on
    - wal_age_seconds:
        usage: GAUGE
        description: Seconds since the last archived WAL, or -1 when unknown
    - wal_failed_count:
        usage: GAUGE
        description: Failed WAL archive attempts counted by PostgreSQL
