# Non-production sink. Starting Alertmanager does not prove a notification was delivered.
# The URL must match infra/observability/alertmanager/non-production-sink.url.

global:
  resolve_timeout: 5m

route:
  receiver: non-production-sink
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: non-production-sink
    webhook_configs:
      - url: http://127.0.0.1:9/gym-observability-non-production-sink
        send_resolved: false
